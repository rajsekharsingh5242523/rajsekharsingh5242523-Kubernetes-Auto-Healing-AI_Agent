apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: demo
spec:
  replicas: 1

  selector:
    matchLabels:
      app: memory-hog

  template:
    metadata:
      labels:
        app: memory-hog

    spec:
      containers:
        - name: hog
          image: polinux/stress

          resources:
            requests:
              memory: "32Mi"

            limits:
              memory: "256Mi"

          command:
            - stress

          args:
            - "--vm"
            - "1"
            - "--vm-bytes"
            - "128M"
            - "--vm-hang"
            - "1"
